services:
  ml:
    build: ./ml
    container_name: fynds-ml
    restart: always
    env_file:
      - ./ml/.env.docker 
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_URL=grpc://qdrant:6334
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fynds-qdrant
    restart: always
    ports:
      - "6333:6333"           # Qdrant HTTP API
      - "6334:6334"           # Qdrant gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO

volumes:
  qdrant_storage: